server:
  port: 9090

# 数据库配置
spring:
  datasource:
    driver-class-name: com.mysql.cj.jdbc.Driver
    username: root
    password: 123456
    url: jdbc:mysql://localhost:3306/shop?useUnicode=true&characterEncoding=utf-8&allowMultiQueries=true&useSSL=false&serverTimezone=GMT%2b8&allowPublicKeyRetrieval=true
  servlet:
    multipart:
      max-file-size: 100MB
      max-request-size: 100MB
  data:
    redis:
      host: localhost
      port: 6379
      timeout: 3000ms

# 配置mybatis实体和xml映射
mybatis:
  mapper-locations: classpath:mapper/*.xml
  configuration:
    log-impl: org.apache.ibatis.logging.stdout.StdOutImpl
    map-underscore-to-camel-case: true

fileBaseUrl: http://localhost

# AI 客服 API 密钥
ai:
  api-key: sk-597720468cba47999073d9873bfe002a


# 支付宝沙箱配置（替换成你自己的沙箱参数）
alipay:
  # 沙箱环境的AppID
  app-id: 9021000165635352
  # 应用私钥（PKCS8格式，不含-----BEGIN/END-----）
  app-private-key: 
  # 支付宝公钥（沙箱环境的支付宝公钥）
  alipay-public-key: 
  # 沙箱网关地址
  gateway-url: https://openapi-sandbox.dl.alipaydev.com/gateway.do
  # 支付后回跳地址（前端页面）
  return-url: http://localhost:5173/#/front/userOrders
