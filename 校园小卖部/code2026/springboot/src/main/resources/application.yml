server:
  port: 9090

# 数据库配置（口令请用环境变量 DB_PASSWORD 提供，不要写死在仓库里）
spring:
  datasource:
    driver-class-name: com.mysql.cj.jdbc.Driver
    username: ${DB_USERNAME:root}
    password: ${DB_PASSWORD:123456}
    url: jdbc:mysql://${DB_HOST:localhost}:${DB_PORT:3306}/${DB_NAME:shop}?useUnicode=true&characterEncoding=utf-8&allowMultiQueries=true&useSSL=false&serverTimezone=GMT%2b8&allowPublicKeyRetrieval=true
  servlet:
    multipart:
      max-file-size: 100MB
      max-request-size: 100MB
  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}
      timeout: 3000ms

# 配置mybatis实体和xml映射
mybatis:
  mapper-locations: classpath:mapper/*.xml
  configuration:
    log-impl: org.apache.ibatis.logging.stdout.StdOutImpl
    map-underscore-to-camel-case: true

fileBaseUrl: ${FILE_BASE_URL:http://localhost}

# AI 客服 API 密钥（用环境变量 AI_API_KEY 提供，不要提交真实密钥）
ai:
  api-key: ${AI_API_KEY:}

# 验证码邮件脚本（可选；留空则回退到 ../vue/email-sender.js）
captcha:
  script-path: ${CAPTCHA_SCRIPT_PATH:}
  node-path: ${CAPTCHA_NODE_PATH:node}


# 支付宝沙箱配置（私钥/公钥只从环境变量读取，不要提交到仓库）
alipay:
  # 沙箱环境的AppID
  app-id: ${ALIPAY_APP_ID:your_sandbox_app_id}
  # 应用私钥（PKCS8格式，不含-----BEGIN/END-----），通过 ALIPAY_APP_PRIVATE_KEY 提供
  app-private-key: ${ALIPAY_APP_PRIVATE_KEY:}
  # 支付宝公钥（沙箱环境的支付宝公钥），通过 ALIPAY_PUBLIC_KEY 提供
  alipay-public-key: ${ALIPAY_PUBLIC_KEY:}
  # 沙箱网关地址
  gateway-url: ${ALIPAY_GATEWAY_URL:https://openapi-sandbox.dl.alipaydev.com/gateway.do}
  # 支付后回跳地址（前端页面）
  return-url: ${ALIPAY_RETURN_URL:http://localhost:5173/#/front/userOrders}
